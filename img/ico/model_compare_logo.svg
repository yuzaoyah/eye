<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgCyber" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </radialGradient>

    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="30%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="star" d="M0,-8 L2,-2 L8,-2 L3,2 L5,8 L0,4 L-5,8 L-3,2 L-8,-2 L-2,-2 Z" fill="#ffffff"/>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#bgCyber)"/>

  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#neonGrad)" stroke-width="1" opacity="0.3" stroke-dasharray="8 4"/>
  <circle cx="200" cy="200" r="165" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.2"/>

  <g transform="translate(200, 200)">
    <g opacity="0.25">
      <polygon points="0,-120 103.9,-60 103.9,60 0,120 -103.9,60 -103.9,-60" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
      <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="none" stroke="#64748b" stroke-width="1"/>
      <polygon points="0,-80 69.3,-40 69.3,40 0,80 -69.3,40 -69.3,-40" fill="none" stroke="#94a3b8" stroke-width="0.6"/>
      <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#cbd5e1" stroke-width="0.5"/>
      <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="none" stroke="#e2e8f0" stroke-width="0.4"/>
    </g>

    <g opacity="0.35">
      <line x1="0" y1="0" x2="0" y2="-120" stroke="#64748b" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="103.9" y2="-60" stroke="#64748b" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="103.9" y2="60" stroke="#64748b" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="0" y2="120" stroke="#64748b" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="-103.9" y2="60" stroke="#64748b" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="-103.9" y2="-60" stroke="#64748b" stroke-width="0.8"/>
    </g>

    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="url(#neonGrad)" opacity="0.12" filter="url(#strongGlow)"/>
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="none" stroke="url(#neonGrad)" stroke-width="3" stroke-linejoin="round" filter="url(#strongGlow)"/>
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="none" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" opacity="0.6"/>

    <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 2"/>

    <circle cx="0" cy="-100" r="12" fill="#06b6d4" opacity="0.25" filter="url(#strongGlow)"/>
    <circle cx="0" cy="-100" r="6" fill="#06b6d4" filter="url(#strongGlow)"/>
    <use href="#star" x="0" y="-100" fill="#ffffff" transform="scale(0.8) translate(0, -125)"/>

    <circle cx="86.6" cy="-50" r="12" fill="#3b82f6" opacity="0.25" filter="url(#strongGlow)"/>
    <circle cx="86.6" cy="-50" r="6" fill="#3b82f6" filter="url(#strongGlow)"/>
    <use href="#star" x="86.6" y="-50" fill="#ffffff" transform="scale(0.8) translate(108.25, -62.5)"/>

    <circle cx="86.6" cy="50" r="12" fill="#8b5cf6" opacity="0.25" filter="url(#strongGlow)"/>
    <circle cx="86.6" cy="50" r="6" fill="#8b5cf6" filter="url(#strongGlow)"/>
    <use href="#star" x="86.6" y="50" fill="#ffffff" transform="scale(0.8) translate(108.25, 62.5)"/>

    <circle cx="0" cy="100" r="12" fill="#d946ef" opacity="0.25" filter="url(#strongGlow)"/>
    <circle cx="0" cy="100" r="6" fill="#d946ef" filter="url(#strongGlow)"/>
    <use href="#star" x="0" y="100" fill="#ffffff" transform="scale(0.8) translate(0, 125)"/>

    <circle cx="-86.6" cy="50" r="12" fill="#8b5cf6" opacity="0.25" filter="url(#strongGlow)"/>
    <circle cx="-86.6" cy="50" r="6" fill="#8b5cf6" filter="url(#strongGlow)"/>
    <use href="#star" x="-86.6" y="50" fill="#ffffff" transform="scale(0.8) translate(-108.25, 62.5)"/>

    <circle cx="-86.6" cy="-50" r="12" fill="#3b82f6" opacity="0.25" filter="url(#strongGlow)"/>
    <circle cx="-86.6" cy="-50" r="6" fill="#3b82f6" filter="url(#strongGlow)"/>
    <use href="#star" x="-86.6" y="-50" fill="#ffffff" transform="scale(0.8) translate(-108.25, -62.5)"/>

    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#neonGrad)" stroke-width="2" opacity="0.5" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="url(#neonGrad)" stroke-width="3" filter="url(#strongGlow)"/>
    <circle cx="0" cy="0" r="8" fill="url(#neonGrad)" filter="url(#strongGlow)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <circle cx="40" cy="40" r="3" fill="#06b6d4" opacity="0.6"/>
  <circle cx="360" cy="40" r="3" fill="#d946ef" opacity="0.6"/>
  <circle cx="40" cy="360" r="3" fill="#d946ef" opacity="0.6"/>
  <circle cx="360" cy="360" r="3" fill="#06b6d4" opacity="0.6"/>
</svg>